      <section id="contact-forms">
        <h2>Kontaktieren Sie uns</h2>
        <p>Wenn Sie Fragen haben, füllen Sie bitte dieses Kontaktformular aus. Vielen Dank!</p>
        <form id="contactForm" action="send_email.php" method="post" enctype="multipart/form-data">
            
            <div class="form-group-row">
                <div class="form-group">
                    <label for="first-name">Vorname</label>
                    <input type="text" id="first-name" name="first-name" required>
                </div>
                <div class="form-group">
                    <label for="last-name">Nachname</label>
                    <input type="text" id="last-name" name="last-name" required>
                </div>
            </div>
    
            <div class="form-group">
                <label for="email">E-Mail</label>
                <input type="email" id="email" name="email" required>
            </div>
    
            <div class="form-group">
                <label for="message">Nachricht</label>
                <textarea id="message" name="message" rows="6" required></textarea>
            </div>
    
            <div class="form-group">
                <label for="file">Dokument hochladen</label>
                <input type="file" id="file" name="attachment[]" accept=".pdf,.doc,.docx,.jpg,.png" multiple required>
                <small>Zulässige Formate: PDF, DOC, DOCX, JPG, PNG (Max 5MB)</small>
            </div>
    
            <button type="submit">Absenden</button>
    
            <p id="successMessage" style="display: none; color: green; margin-top: 20px;">
                Ihre Nachricht wurde erfolgreich gesendet!
            </p>
        </form>
    </section>

    <script src="script.js"></script>
